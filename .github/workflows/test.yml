name: PaperLens Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Stability & regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUNBUFFERED: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package requirements and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<10"
          python -m pip check
      - name: Compile runtime and test modules
        run: python -m compileall -q app.py analyzer.py validation.py context_review.py display_helpers.py test_*.py
      - name: Run all tests including Streamlit AppTest and in-memory PDF integration
        run: python -m pytest -q --strict-markers
