name: PaperLens Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and API test requirements
        run: |
          python -m pip install -r requirements.txt -r backend/requirements.txt
          python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q app.py analyzer.py validation.py context_review.py display_helpers.py backend
      - name: Run parser, UI and HTTP API tests
        run: python -m pytest -q
