# PaperLens MD - hosted API preview, intentionally gated
# Upload analysis is disabled until a reviewed authentication/abuse policy is in place.
services:
  - type: web
    name: paperlens-api-preview
    runtime: python
    plan: free
    region: singapore
    branch: web/backend-fastapi
    autoDeployTrigger: off
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PAPERLENS_UPLOADS_ENABLED
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
